# Debug commit issue
version: '3.8'
services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: zxcvbnmKMA2803
      MYSQL_DATABASE: quanlydaotao
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./kma_be
    restart: always
    depends_on:
      - mysql
    environment:
      DB_USERNAME: root
      DB_PASSWORD: zxcvbnmKMA2803
      DB_DATABASE: quanlydaotao
      DB_HOST: mysql
      DB_DIALECT: mysql
    ports:
      - "8001:8000"

  frontend:
    build: ./kma_fe
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mysql-data:
